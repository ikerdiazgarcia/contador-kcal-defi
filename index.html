<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contador Nutricional</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  /* ── BASE (se sobreescribe por data-theme) ── */
  :root {
    --radius:8px; --radius-lg:12px;
    --bg:#ffffff; --bg2:#f6f6f4; --bg3:#efefeb;
    --text:#1a1a18; --text2:#6b6b67; --text3:#9a9a96;
    --border:rgba(0,0,0,0.09); --border2:rgba(0,0,0,0.16);
    --acc:#3B6D11; --acc-bg:#EAF3DE; --acc-mid:#97C459; --acc-text:#27500A; --acc-dark:#3B6D11;
    --red-bg:#FCEBEB; --red-mid:#F09595; --red-text:#791F1F;
    --amber-bg:#FAEEDA; --amber-text:#633806;
  }
  /* ── CLARO: paleta original verde/azul ── */
  [data-theme="default"] {
    --bg:#ffffff; --bg2:#f6f6f4; --bg3:#efefeb;
    --text:#1a1a18; --text2:#6b6b67; --text3:#9a9a96;
    --border:rgba(0,0,0,0.09); --border2:rgba(0,0,0,0.16);
    --acc:#3B6D11; --acc-bg:#EAF3DE; --acc-mid:#97C459; --acc-text:#27500A; --acc-dark:#3B6D11;
    --red-bg:#FCEBEB; --red-mid:#F09595; --red-text:#791F1F;
    --amber-bg:#FAEEDA; --amber-text:#633806;
  }
  /* ── CLAROS ── */
  [data-theme="deep-space-l"] {
    --bg:#ffffff; --bg2:#f0f9ff; --bg3:#e0f2fe;
    --text:#0c4a6e; --text2:#0369a1; --text3:#7dd3fc;
    --border:rgba(3,105,161,0.12); --border2:rgba(3,105,161,0.25);
    --acc:#0369a1; --acc-bg:#e0f2fe; --acc-mid:#38bdf8; --acc-text:#0c4a6e; --acc-dark:#0369a1;
    --red-bg:#fff1f2; --red-mid:#fda4af; --red-text:#9f1239;
    --amber-bg:#fffbeb; --amber-text:#92400e;
  }
  [data-theme="steel-teal-l"] {
    --bg:#ffffff; --bg2:#f0fdfa; --bg3:#ccfbf1;
    --text:#134e4a; --text2:#0f766e; --text3:#5eead4;
    --border:rgba(15,118,110,0.12); --border2:rgba(15,118,110,0.25);
    --acc:#0f766e; --acc-bg:#f0fdfa; --acc-mid:#2dd4bf; --acc-text:#134e4a; --acc-dark:#0f766e;
    --red-bg:#fff1f2; --red-mid:#fda4af; --red-text:#9f1239;
    --amber-bg:#fffbeb; --amber-text:#92400e;
  }
  [data-theme="void-purple-l"] {
    --bg:#ffffff; --bg2:#faf5ff; --bg3:#ede9fe;
    --text:#4c1d95; --text2:#7c3aed; --text3:#c4b5fd;
    --border:rgba(124,58,237,0.12); --border2:rgba(124,58,237,0.25);
    --acc:#7c3aed; --acc-bg:#faf5ff; --acc-mid:#a78bfa; --acc-text:#4c1d95; --acc-dark:#7c3aed;
    --red-bg:#fff1f2; --red-mid:#fda4af; --red-text:#9f1239;
    --amber-bg:#fffbeb; --amber-text:#92400e;
  }
  [data-theme="matrix-l"] {
    --bg:#ffffff; --bg2:#f0fdf4; --bg3:#dcfce7;
    --text:#14532d; --text2:#16a34a; --text3:#86efac;
    --border:rgba(22,163,74,0.12); --border2:rgba(22,163,74,0.25);
    --acc:#16a34a; --acc-bg:#f0fdf4; --acc-mid:#4ade80; --acc-text:#14532d; --acc-dark:#16a34a;
    --red-bg:#fff1f2; --red-mid:#fda4af; --red-text:#9f1239;
    --amber-bg:#fffbeb; --amber-text:#92400e;
  }
  /* ── OSCUROS ── */
  [data-theme="deep-space"] {
    --bg:#111827; --bg2:#0a0e1a; --bg3:#06090f;
    --text:#e0f4ff; --text2:#7ec8e3; --text3:#3d6a7c;
    --border:rgba(79,195,247,0.12); --border2:rgba(79,195,247,0.25);
    --acc:#4fc3f7; --acc-bg:#1e3a5f; --acc-mid:#0e7490; --acc-text:#bae6fd; --acc-dark:#4fc3f7;
    --red-bg:#3b0f0f; --red-mid:#7f1d1d; --red-text:#fca5a5;
    --amber-bg:#2d1a00; --amber-text:#fbbf24;
  }
  [data-theme="steel-teal"] {
    --bg:#0f1f2e; --bg2:#09111a; --bg3:#050d12;
    --text:#f0fdfa; --text2:#2dd4bf; --text3:#0f4c44;
    --border:rgba(45,212,191,0.13); --border2:rgba(45,212,191,0.26);
    --acc:#2dd4bf; --acc-bg:#134e4a; --acc-mid:#0f766e; --acc-text:#99f6e4; --acc-dark:#2dd4bf;
    --red-bg:#3b0f0f; --red-mid:#7f1d1d; --red-text:#fca5a5;
    --amber-bg:#2d1a00; --amber-text:#fbbf24;
  }
  [data-theme="void-purple"] {
    --bg:#12102a; --bg2:#080810; --bg3:#050508;
    --text:#ede9fe; --text2:#a78bfa; --text3:#4c1d95;
    --border:rgba(167,139,250,0.13); --border2:rgba(167,139,250,0.26);
    --acc:#a78bfa; --acc-bg:#4c1d95; --acc-mid:#7c3aed; --acc-text:#ddd6fe; --acc-dark:#a78bfa;
    --red-bg:#3b0f0f; --red-mid:#7f1d1d; --red-text:#fca5a5;
    --amber-bg:#2d1a00; --amber-text:#fbbf24;
  }
  [data-theme="matrix"] {
    --bg:#0a1a0e; --bg2:#030805; --bg3:#020503;
    --text:#f0fdf4; --text2:#4ade80; --text3:#14532d;
    --border:rgba(74,222,128,0.13); --border2:rgba(74,222,128,0.26);
    --acc:#4ade80; --acc-bg:#14532d; --acc-mid:#16a34a; --acc-text:#bbf7d0; --acc-dark:#4ade80;
    --red-bg:#3b0f0f; --red-mid:#7f1d1d; --red-text:#fca5a5;
    --amber-bg:#2d1a00; --amber-text:#fbbf24;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;}
  #root{max-width:820px;margin:0 auto;padding:16px;}
  select,input[type=number],input[type=text]{
    height:36px;border:0.5px solid var(--border2);border-radius:var(--radius);
    padding:0 10px;font-size:13px;background:var(--bg);color:var(--text);
    width:100%;outline:none;transition:border-color .15s,box-shadow .15s;font-family:inherit;
  }
  select:focus,input:focus{box-shadow:0 0 0 2px rgba(100,100,200,.2);border-color:var(--acc-dark);}
  button{
    height:36px;border:0.5px solid var(--border2);border-radius:var(--radius);
    padding:0 14px;font-size:13px;background:var(--bg);color:var(--text);
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    transition:background .12s,transform .1s;font-family:inherit;white-space:nowrap;
  }
  button:hover{background:var(--bg2);}
  button:active{transform:scale(.98);}
  .btn-add{background:var(--acc-bg);color:var(--acc-text);border-color:var(--acc-mid);font-weight:500;}
  .btn-add:hover{filter:brightness(.92);}
  .btn-reset{color:var(--red-text);border-color:var(--red-mid);background:var(--red-bg);}
  .btn-reset:hover{filter:brightness(.94);}
  .btn-edit{background:var(--acc-bg);color:var(--acc-text);border-color:var(--acc-mid);}
  .btn-edit:hover{filter:brightness(.92);}
  .btn-save{background:var(--acc-bg);color:var(--acc-text);border-color:var(--acc-mid);}
  .btn-ghost{background:var(--bg2);}
  .btn-wide{width:100%;justify-content:center;}
  .btn-sm{height:28px;padding:0 10px;font-size:12px;}
  .btn-icon{height:28px;width:28px;padding:0;justify-content:center;border-color:transparent;
    background:none;color:var(--text3);font-size:14px;border-radius:var(--radius);flex-shrink:0;}
  .btn-icon:hover{background:var(--red-bg);color:var(--red-text);border-color:var(--red-mid);}
  .btn-icon-b{color:var(--text3);}
  .btn-icon-b:hover{background:var(--acc-bg);color:var(--acc-text);border-color:var(--acc-mid);}
  .card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);}
  .cp{padding:14px 16px;}
  .header{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px;margin-bottom:14px;gap:10px;}
  .header-title{font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px;}
  .header-sub{font-size:11px;color:var(--text3);margin-top:2px;text-transform:capitalize;}
  .hactions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end;flex-shrink:0;max-width:60%;}
  @media(max-width:480px){.hactions .btn-label{display:none;}}
  .stats{display:flex;gap:10px;margin-bottom:14px;}
  .stat{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);
    padding:12px 16px;flex:1;text-align:center;}
  .stat-label{font-size:11px;color:var(--text2);margin-bottom:3px;}
  .stat-val{font-size:24px;font-weight:600;line-height:1.1;}
  .stat-unit{font-size:13px;font-weight:400;}
  .kcal{color:var(--acc-dark);font-weight:500;}
  .prot{color:var(--acc-dark);opacity:.75;font-weight:500;}
  .date-pills{display:flex;gap:5px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none;padding-bottom:2px;}
  .date-pills::-webkit-scrollbar{display:none;}
  .dpill{flex-direction:column;gap:1px;height:auto;padding:5px 12px;flex:0 0 auto;font-size:12px;border-radius:16px;}
  .dpill.active{background:var(--acc-bg);color:var(--acc-text);border-color:var(--acc-mid);}
  .dpill.past{background:var(--bg2);color:var(--text3);border-color:var(--border);}
  .dpill.past.active{background:var(--bg3);color:var(--text2);border-color:var(--border2);}
  .dpill.nodata{opacity:.5;}
  .dpill-sub{font-size:9px;color:var(--acc-dark);display:block;text-align:center;}
  .dpill:not(.active) .dpill-sub{color:var(--text3);}
  .tabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{height:auto;padding:7px 11px;flex-direction:column;gap:2px;font-size:11px;
    min-width:68px;flex:0 0 auto;background:var(--bg);border-color:var(--border);}
  .tab-icon{font-size:17px;color:var(--text3);}
  .tab.active{background:var(--acc-bg);color:var(--acc-text);border-color:var(--acc-mid);}
  .tab.active .tab-icon{color:var(--acc-text);}
  .tab-sub{font-size:9px;color:var(--acc-dark);}
  table{width:100%;border-collapse:collapse;}
  th{font-size:11px;font-weight:500;color:var(--text2);padding:6px 8px;text-align:right;
    background:var(--bg2);border-bottom:0.5px solid var(--border);}
  th:first-child{text-align:left;}
  td{padding:6px 8px;font-size:12px;text-align:right;border-bottom:0.5px solid var(--border);vertical-align:middle;}
  td:first-child{text-align:left;}
  tr:last-child td{border-bottom:none;}
  .tfoot td{border-top:0.5px solid var(--border2)!important;border-bottom:none!important;
    background:var(--bg2);font-weight:600;font-size:13px;}
  .preview{margin-top:7px;font-size:12px;color:var(--acc-dark);background:var(--acc-bg);
    border-radius:6px;padding:4px 10px;display:inline-block;}
  .empty{text-align:center;padding:2.5rem 1rem;color:var(--text3);font-size:13px;}
  .empty-icon{font-size:40px;display:block;margin-bottom:8px;opacity:.25;}
  .modified{background:var(--acc-bg)!important;}
  .modified td:first-child{color:var(--acc-text);}
  label{font-size:11px;color:var(--text2);display:block;margin-bottom:3px;}
  .sec-title{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:10px;
    display:flex;align-items:center;gap:6px;}
  .info-note{font-size:11px;color:var(--text2);line-height:1.6;padding:8px 10px;background:var(--bg2);
    border-radius:var(--radius);border-left:2px solid var(--border2);margin-bottom:12px;}
  .compact{height:28px!important;font-size:11px!important;padding:0 5px!important;}
  .compact-sel{height:28px!important;font-size:11px!important;padding:0 4px!important;}
  .day-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;
    border-bottom:0.5px solid var(--border);font-size:13px;}
  .day-row:last-child{border-bottom:none;}
  .hist-item{display:flex;justify-content:space-between;padding:3px 0 3px 22px;font-size:12px;color:var(--text3);}
  .divider{border:none;border-top:0.5px solid var(--border2);margin:8px 0;}
  .row-g{display:flex;gap:8px;}
  .col-g{display:flex;flex-direction:column;gap:8px;}
  .readonly-banner{background:var(--amber-bg);color:var(--amber-text);border:0.5px solid rgba(99,56,6,.25);
    border-radius:var(--radius);padding:7px 12px;font-size:12px;display:flex;align-items:center;
    gap:7px;margin-bottom:14px;}
  .edit-row{border-bottom:0.5px solid var(--border);}
  .edit-row:last-child{border-bottom:none;}
  .tag-custom{font-size:9px;padding:1px 5px;border-radius:4px;background:var(--acc-bg);
    color:var(--acc-text);font-weight:500;margin-left:4px;}
  .tag-base{font-size:9px;padding:1px 5px;border-radius:4px;background:var(--bg2);
    color:var(--text3);font-weight:500;margin-left:4px;}
  .inp-kcal{border-color:var(--acc-mid)!important;background:var(--acc-bg)!important;color:var(--acc-text)!important;}
  .inp-kcal::placeholder{color:var(--acc-dark);opacity:.6;}
  .inp-prot{border-color:var(--acc-mid)!important;background:var(--acc-bg)!important;color:var(--acc-text)!important;opacity:.8;}
  .inp-prot::placeholder{color:var(--acc-dark);opacity:.5;}
  .edit-grid-desktop{display:grid;grid-template-columns:1fr 80px 65px 65px 80px 70px;gap:6px;padding:7px 12px;align-items:center;}
  .edit-card-mob{padding:8px 12px;}
  .edit-row1{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
  .edit-row2{display:flex;gap:6px;}
  .edit-name{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  @media(min-width:600px){.edit-card-mob{display:none!important;}.edit-grid-desktop{display:grid!important;}}
  @media(max-width:599px){.edit-grid-desktop{display:none!important;}.edit-card-mob{display:block!important;}}
  .quick-add-grid{display:grid;grid-template-columns:1fr 72px 72px 72px;gap:6px;}
  @media(max-width:480px){.quick-add-grid{grid-template-columns:1fr 1fr;}}
  .toggle-pill{display:inline-flex;border:0.5px solid var(--border2);border-radius:20px;overflow:hidden;}
  .toggle-pill button{border:none;border-radius:0;background:none;height:28px;padding:0 10px;font-size:11px;color:var(--text2);}
  .toggle-pill button.on{background:var(--acc-bg);color:var(--acc-text);font-weight:500;}
  .toggle-pill button:first-child{border-right:0.5px solid var(--border2);}
  .toggle-pill button:hover{background:var(--bg2);}
  .mob-nav{display:none;}
  @media(max-width:600px){
    .mob-nav{
      display:flex;position:fixed;bottom:0;left:0;right:0;
      background:var(--bg);border-top:0.5px solid var(--border2);
      z-index:200;
      padding-bottom:env(safe-area-inset-bottom, 0px);
    }
    .mob-nav-btn{
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:5px;padding:30px 4px 55px;border:none;background:none;cursor:pointer;
      color:var(--text3);font-size:10px;font-weight:500;letter-spacing:.02em;
      transition:color .12s,background .12s;font-family:inherit;
    }
    .mob-nav-btn i{font-size:26px;display:block;}
    .mob-nav-btn:active{background:var(--bg2);}
    .mob-nav-btn.active-tab{color:var(--acc-dark);}
    .mob-nav-btn.warn{color:var(--amber-text);}
    .mob-nav-btn.acc{color:var(--acc-dark);}
    .desktop-hactions{display:flex;}
  }
  @media(max-width:600px){
    .desktop-hactions{display:none!important;}
    #root{padding-bottom:calc(88px + env(safe-area-inset-bottom, 0px));}
  }
  .settings-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:300;
    display:flex;align-items:flex-end;justify-content:center;
  }
  @media(min-width:601px){.settings-overlay{align-items:center;}}
  .settings-panel{
    background:var(--bg);border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    width:100%;max-width:480px;padding:20px 20px 32px;border:0.5px solid var(--border2);
  }
  @media(min-width:601px){.settings-panel{border-radius:var(--radius-lg);padding:20px;}}
  .settings-title{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
  .theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .theme-card{
    border-radius:var(--radius);padding:10px;cursor:pointer;
    border:2px solid transparent;transition:border-color .13s,transform .1s;
    display:flex;flex-direction:column;gap:5px;
  }
  .theme-card:hover{transform:translateY(-1px);}
  .theme-card.selected{border-color:var(--acc-dark);}
  .theme-dot-row{display:flex;gap:3px;}
  .theme-dot{width:14px;height:14px;border-radius:50%;}
  .theme-name{font-size:10px;font-weight:500;margin-top:2px;}
  .saved-meals-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;flex-wrap:wrap;}
  .saved-pill{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;
    border-radius:15px;border:0.5px solid var(--acc-mid);background:var(--acc-bg);
    color:var(--acc-text);font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;
    transition:filter .12s,transform .1s;flex-shrink:0;}
  .saved-pill:hover{filter:brightness(.92);}
  .saved-pill:active{transform:scale(.97);}
  .saved-pill .del{margin-left:3px;opacity:.5;font-size:13px;padding:0 2px;
    background:none;border:none;cursor:pointer;color:inherit;line-height:1;}
  .saved-pill .del:hover{opacity:1;}
  .save-meal-form{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap;}
</style>
</head>
<body>
<div id="root"></div>
<script>
// Usamos React sin JSX (sintaxis nativa compatible con file:///)
const e = React.createElement;
const { useState, useMemo, useEffect, useRef } = React;

const LS = {
  get: k => { try { const v = localStorage.getItem(k); return v != null ? JSON.parse(v) : null; } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) { console.warn(e); } },
  del: k => { try { localStorage.removeItem(k); } catch {} },
};

const THEMES = [
  { id:'default',       name:'Clásico',    bg:'#ffffff', bg2:'#f6f6f4', acc:'#3B6D11', dark:false, group:'Clásico' },
  { id:'deep-space-l',  name:'Deep Space', bg:'#ffffff', bg2:'#f0f9ff', acc:'#0369a1', dark:false, group:'Claro'   },
  { id:'steel-teal-l',  name:'Steel Teal', bg:'#ffffff', bg2:'#f0fdfa', acc:'#0f766e', dark:false, group:'Claro'   },
  { id:'void-purple-l', name:'Void Purple',bg:'#ffffff', bg2:'#faf5ff', acc:'#7c3aed', dark:false, group:'Claro'   },
  { id:'matrix-l',      name:'Matrix',     bg:'#ffffff', bg2:'#f0fdf4', acc:'#16a34a', dark:false, group:'Claro'   },
  { id:'deep-space',    name:'Deep Space', bg:'#111827', bg2:'#0a0e1a', acc:'#4fc3f7', dark:true,  group:'Oscuro'  },
  { id:'steel-teal',    name:'Steel Teal', bg:'#0f1f2e', bg2:'#09111a', acc:'#2dd4bf', dark:true,  group:'Oscuro'  },
  { id:'void-purple',   name:'Void Purple',bg:'#12102a', bg2:'#080810', acc:'#a78bfa', dark:true,  group:'Oscuro'  },
  { id:'matrix',        name:'Matrix',     bg:'#0a1a0e', bg2:'#030805', acc:'#4ade80', dark:true,  group:'Oscuro'  },
];

function applyTheme(id) { document.documentElement.setAttribute('data-theme', id); }

const REAL_TODAY = new Date().toISOString().slice(0, 10);
const MAX_HIST   = 4;

function manageDates(stored, currentDay) {
  let ds = [...new Set([currentDay, ...(stored || [])])].sort().reverse();
  const keep   = ds.slice(0, MAX_HIST + 1);
  const remove = ds.slice(MAX_HIST + 1);
  remove.forEach(d => LS.del('nutri_day_' + d));
  LS.set('nutri_dates', keep);
  return keep;
}

function fmtDate(ds, currentDay) {
  if (ds === currentDay) return 'Hoy';
  const dCur = new Date(currentDay + 'T12:00:00');
  const d    = new Date(ds + 'T12:00:00');
  const diff = Math.round((dCur - d) / 86400000);
  if (diff === 1) return 'Ayer';
  return d.toLocaleDateString('es-ES', { weekday:'short', day:'numeric', month:'short' });
}

const initMeals = () => Object.fromEntries(MEALS.map(m => [m.id, []]));
function sortFoods(arr) { return [...arr].sort((a, b) => a.name.localeCompare(b.name, 'es', { sensitivity: 'base' })); }

function calcFood(food, amount, overrides) {
  const ov  = overrides?.[food.id] || {};
  const k   = ov.kcal         !== undefined ? +ov.kcal         : food.kcalPer100;
  const p   = ov.protein      !== undefined ? +ov.protein      : food.proteinPer100;
  const unt = ov.unit         !== undefined ? ov.unit          : food.unit;
  const gpu = ov.gramsPerUnit !== undefined ? +ov.gramsPerUnit : food.gramsPerUnit ? +food.gramsPerUnit : null;

  if (unt === 'uds') {
    if (gpu) {
      return { kcal: Math.round(amount * gpu / 100 * k), protein: Math.round(amount * gpu / 100 * p * 10) / 10 };
    }
    return { kcal: Math.round(amount * k), protein: Math.round(amount * p * 10) / 10 };
  }
  return { kcal: Math.round(amount / 100 * k), protein: Math.round(amount / 100 * p * 10) / 10 };
}

function getEffUnit(food, overrides) { return overrides?.[food.id]?.unit ?? food.unit; }

function enrichItems(items, allFoods, overrides) {
  return items.map(item => {
    if (item._fixed) return item;
    const f = allFoods.find(x => x.id === item.foodId);
    if (!f) return { ...item, kcal: item.kcal || 0, protein: item.protein || 0 };
    return { ...item, ...calcFood(f, item.amount, overrides) };
  });
}

function mealTotals(items) {
  return {
    kcal:    items.reduce((s, i) => s + i.kcal, 0),
    protein: Math.round(items.reduce((s, i) => s + i.protein, 0) * 10) / 10,
    count:   items.length,
  };
}

function buildDayTotals(mealData, allFoods, overrides) {
  const breakdown = {};
  let kcal = 0, prot = 0;
  MEALS.forEach(ml => {
    const items = enrichItems(mealData[ml.id] || [], allFoods, overrides);
    const t     = mealTotals(items);
    breakdown[ml.id] = { ...t, items };
    kcal += t.kcal;
    prot += t.protein;
  });
  return { kcal, protein: Math.round(prot * 10) / 10, meals: breakdown };
}

    LS.set('nutri_day_' + currentDay, meals); const base = new Date(currentDay + 'T12:00:00'); base.setDate(base.getDate() + 1); const nextDay = base.toISOString().slice(0, 10);
    setHistory(prev => ({ ...prev, [currentDay]: meals })); setMeals(initMeals()); const newDates = manageDates([currentDay, ...dates.filter(x => x !== currentDay)], nextDay);
    setDates(newDates); setCurrentDay(nextDay); setViewDate(nextDay); LS.set('nutri_currentDay', nextDay);
  };

  const saveCustom = () => {
    if (!newF.name || !newF.kcal || !newF.protein) return;
    const nf = { id: 'c' + Date.now(), name: newF.name, unit: newF.unit, kcalPer100: +newF.kcal, proteinPer100: +newF.protein, ...(newF.unit === 'uds' && newF.gramsPerUnit ? { gramsPerUnit: +newF.gramsPerUnit } : {}) };
    setCustom(p => p.concat(nf)); setSelFood(nf.id); setNewF({ name:'', unit:'g', kcal:'', protein:'', gramsPerUnit:'' }); setShowAdd(false);
  };

  if (loading) return e('div', { style: { textAlign:'center', padding:'3rem', color:'var(--text2)' } }, e('i', { className: 'ti ti-loader' }), ' Cargando datos...');

  const isToday      = viewDate === currentDay;
  const curItems     = enrichedToday[active] || [];
  const curTotals    = todayMealT[active];
  const activeMeal   = MEALS.find(m => m.id === active);
  const curSavedMeals = savedMeals[active] || [];
  const preview      = amt && +amt > 0 && food ? calcFood(food, +amt, overrides) : null;
  const hasDayData   = Object.values(todayMealT).some(t => t.count > 0);
  const todayLabel   = new Date(currentDay + 'T12:00:00').toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' });

  const renderSettingsModal = () => {
    if (!showSettings) return null;
    return e('div', { className: 'settings-overlay', onClick: () => setShowSettings(false) },
      e('div', { className: 'settings-panel', onClick: e => e.stopPropagation() },
        e('div', { className: 'settings-title' }, e('i', { className: 'ti ti-settings' }), 'Configuración'),
        e('p', { style: { fontSize:12, color:'var(--text2)', marginBottom:12 } }, 'Tema de color'),
        e('div', { className: 'theme-grid' },
          ['Clásico','Claro','Oscuro'].map(grp => {
            const items = THEMES.filter(t => t.group === grp);
            return e(React.Fragment, { key: grp },
              e('div', { style: { gridColumn:'1/-1', fontSize:10, fontWeight:600, color:'var(--text3)', textTransform:'uppercase', marginTop: 8 } }, grp),
              items.map(t => e('div', { key: t.id, className: `theme-card ${theme===t.id?'selected':''}`, style: { background: t.bg, border: theme===t.id?`2px solid ${t.acc}`:`1.5px solid rgba(128,128,128,0.2)` }, onClick: () => setTheme(t.id) },
                e('div', { className: 'theme-dot-row' }, e('div', { className: 'theme-dot', style: { background: t.acc } }), e('div', { className: 'theme-dot', style: { background: t.bg2 } })),
                e('div', { className: 'theme-name', style: { color: t.dark?'#e5e7eb':'#374151' } }, t.name)
              ))
            );
          })
        ),
        e('div', { style: { marginTop:20, display:'flex', justifyContent:'flex-end' } }, e('button', { onClick: () => setShowSettings(false) }, 'Cerrar'))
      )
    );
  };

  const navBar = e('nav', { className: 'mob-nav' },
    e('button', { className: `mob-nav-btn ${!editMode ? 'active-tab' : ''}`, onClick: () => setEditMode(false) }, e('i', { className: 'ti ti-home' }), 'Contador'),
    e('button', { className: `mob-nav-btn ${editMode ? 'active-tab' : ''}`, onClick: () => setEditMode(true) }, e('i', { className: 'ti ti-tools-kitchen-2' }), 'Alimentos'),
    e('button', { className: 'mob-nav-btn warn', style: { opacity: isToday ? 1 : 0.35 }, disabled: !isToday, onClick: () => isToday && setConfirm('advance') }, e('i', { className: 'ti ti-calendar-plus' }), 'Sig. día'),
    e('button', { className: 'mob-nav-btn acc', onClick: () => setShowSettings(true) }, e('i', { className: 'ti ti-settings' }), 'Config.')
  );

  if (editMode) {
    return e('div', null, e(EditView, { allFoods, overrides, setOverrides, custom, setCustom, deletedFoods, setDeletedFoods, onBack: () => setEditMode(false) }), navBar, renderSettingsModal());
  }

  return e('div', { style: { paddingBottom: '2rem' } },
    e('div', { className: 'card cp header' },
      e('div', null, e('div', { className: 'header-title' }, e('i', { className: 'ti ti-leaf' }), 'Contador Nutricional'), e('div', { className: 'header-sub' }, todayLabel)),
      e('div', { className: 'hactions desktop-hactions' },
        e('button', { className: 'btn-edit', onClick: () => setEditMode(true) }, e('i', { className: 'ti ti-edit' }), 'Editar alimentos'),
        isToday && e('button', { style: { background:'var(--amber-bg)', color:'var(--amber-text)' }, onClick: () => setConfirm('advance') }, e('i', { className: 'ti ti-calendar-plus' }), 'Día siguiente'),
        isToday && e('button', { className: 'btn-reset', onClick: () => setConfirm('reset') }, e('i', { className: 'ti ti-refresh' }), 'Reiniciar hoy'),
        e('button', { onClick: () => setShowSettings(true) }, e('i', { className: 'ti ti-settings' }))
      ),
      isToday && e('button', { className: 'btn-reset', style: { display:'none' }, id: 'mob-reset-btn', onClick: () => setConfirm('reset') }, e('i', { className: 'ti ti-refresh' }))
    ),
    confirm && e('div', { style: { position:'fixed', inset:0, background:'rgba(0,0,0,0.45)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center', padding:16 }, onClick: () => setConfirm(null) },
      e('div', { className: 'card cp', style: { maxWidth:340, width:'100%' }, onClick: e => e.stopPropagation() },
        e('div', { style: { fontSize:15, fontWeight:600, marginBottom:8 } }, confirm === 'reset' ? 'Reiniciar el día' : 'Pasar al día siguiente'),
        e('p', { style: { fontSize:13, color:'var(--text2)', marginBottom:16 } }, confirm === 'reset' ? 'Se borrarán todos los alimentos de hoy.' : 'Se guardarán los datos y se abrirá un nuevo día.'),
        e('div', { style: { display:'flex', gap:8, justifyContent:'flex-end' } },
          e('button', { className: 'btn-ghost', onClick: () => setConfirm(null) }, 'Cancelar'),
          e('button', { className: confirm === 'reset' ? 'btn-reset' : '', onClick: () => { if (confirm === 'reset') setMeals(initMeals()); else advanceDay(); setConfirm(null); } }, 'Confirmar')
        )
      )
    ),
    e('div', { className: 'date-pills' }, [...dates].reverse().map(d => {
      const isCurrentDay = d === currentDay; const pd = isCurrentDay ? todayDay : (histData[d] || { kcal:0, protein:0 }); const hasData = pd.kcal > 0 || pd.protein > 0;
      return e('button', { key: d, className: `tab dpill ${viewDate === d ? 'active' : ''} ${!isCurrentDay ? 'past' : ''}`, onClick: () => setViewDate(d) }, e('span', null, fmtDate(d, currentDay)), hasData && e('span', { className: 'dpill-sub' }, `${pd.kcal}k`));
    })),
    !isToday && e('div', { className: 'readonly-banner' }, e('i', { className: 'ti ti-eye' }), ' Modo lectura.', e('button', { onClick: () => setViewDate(currentDay), style: { marginLeft:'auto' } }, 'Ir a hoy')),
    isToday && e(React.Fragment, null,
      e('div', { className: 'stats' },
        e('div', { className: 'stat' }, e('div', { className: 'stat-label' }, 'Calorías del día'), e('div', { className: 'stat-val kcal' }, todayDay.kcal)),
        e('div', { className: 'stat' }, e('div', { className: 'stat-label' }, 'Proteínas del día'), e('div', { className: 'stat-val prot' }, todayDay.protein))
      ),
      e('div', { className: 'tabs' }, MEALS.map(ml => e('button', { key: ml.id, className: `tab ${active === ml.id ? 'active' : ''}`, onClick: () => setActive(ml.id) }, e('i', { className: `ti ${ml.icon} tab-icon` }), ml.name))),
      e('div', { className: 'card cp', style: { marginBottom:10 } },
        e('div', { className: 'sec-title' }, e('i', { className: `ti ${activeMeal?.icon}` }), ` ${activeMeal?.name} — Añadir`),
        curSavedMeals.length > 0 && e('div', { style: { marginBottom:10 } },
          e('select', { value: selSavedMeal, onChange: e => setSelSavedMeal(e.target.value) }, e('option', { value: '' }, '— Aplicar comida guardada —'), curSavedMeals.map(sm => e('option', { key: sm.id, value: sm.id }, sm.name))),
          e('button', { className: 'btn-add', onClick: () => { const sm = curSavedMeals.find(m => m.id === selSavedMeal); if (sm) applySavedMeal(sm); } }, 'Aplicar')
        ),
        e('div', { className: 'row-g', style: { flexWrap:'wrap' } },
          e('div', { style: { flex:'2 1 180px' } }, e('select', { value: selFood, onChange: e => setSelFood(e.target.value) },
            e('optgroup', { label: 'Alimentos Base' }, allFoods.map(f => e('option', { key: f.id, value: f.id }, f.name)))
          )),
          effUnit === 'uds' && e('div', { className: 'toggle-pill' }, e('button', { className: udsMode === 'uds' ? 'on' : '', onClick: () => setUdsMode('uds') }, 'uds'), e('button', { className: udsMode === 'g' ? 'on' : '', onClick: () => setUdsMode('g') }, 'g')),
          e('div', { style: { flex:'1 1 90px' } }, e('input', { type: 'number', placeholder: effUnit==='uds'?udsMode:effUnit, value: amt, onChange: e => setAmt(e.target.value) })),
          e('button', { className: 'btn-add', onClick: addItem }, 'Añadir')
        )
      ),
      curItems.length > 0 ? e('div', { className: 'card', style: { marginBottom:10 } },
        e('table', null,
          e('thead', null, e('tr', null, e('th', null, 'Alimento'), e('th', null, 'Cant.'), e('th', null, 'Kcal'), e('th', null, 'Prot.'), e('th', null, ''))),
          e('tbody', null, curItems.map(item => e('tr', { key: item.id }, e('td', null, item.name), e('td', null, `${item.amount} ${item.unit}`), e('td', { className: 'kcal' }, item.kcal), e('td', { className: 'prot' }, `${item.protein}g`), e('td', null, e('button', { className: 'btn-icon', onClick: () => delItem(active, item.id) }, '×'))))),
          e('tfoot', null, e('tr', null, e('td', { colSpan: 2 }, 'Total'), e('td', { className: 'kcal' }, curTotals.kcal), e('td', { className: 'prot' }, `${curTotals.protein}g`), e('td', null)))
        )
      ) : e('div', { className: 'card', style: { marginBottom:10 } }, e('div', { className: 'empty' }, 'Sin alimentos')),
      hasDayData && e('div', { className: 'card cp' }, e('div', { className: 'sec-title' }, 'Resumen diario'), e('div', { style: { fontWeight:600 } }, `Total: ${todayDay.kcal} kcal · ${todayDay.protein}g proteína`)),
      e('button', { className: 'btn-wide', style: { marginTop: 10 }, onClick: () => setShowAdd(!showAdd) }, 'Nuevo alimento personalizado'),
      showAdd && e('div', { className: 'card cp', style: { marginTop: 10 } },
        e('div', { className: 'col-g' },
          e('input', { type: 'text', placeholder: 'Nombre', value: newF.name, onChange: e => setNewF({ ...newF, name: e.target.value }) }),
          e('div', { className: 'row-g' },
            e('input', { type: 'number', placeholder: 'Kcal', value: newF.kcal, onChange: e => setNewF({ ...newF, kcal: e.target.value }) }),
            e('input', { type: 'number', placeholder: 'Prot', value: newF.protein, onChange: e => setNewF({ ...newF, protein: e.target.value }) })
          ),
          e('button', { className: 'btn-save', onClick: saveCustom }, 'Guardar')
        )
      )
    ),
    !isToday && e(HistoryView, { data: histData[viewDate] }),
    navBar,
    renderSettingsModal()
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(e(App));
</script>
