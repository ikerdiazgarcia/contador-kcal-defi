<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contador Nutricional</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg:#ffffff; --bg2:#f6f6f4; --bg3:#efefeb;
    --text:#1a1a18; --text2:#6b6b67; --text3:#9a9a96;
    --border:rgba(0,0,0,0.09); --border2:rgba(0,0,0,0.16);
    --radius:8px; --radius-lg:12px;
    --green-bg:#EAF3DE; --green-mid:#97C459; --green-text:#27500A; --green-dark:#3B6D11;
    --blue-bg:#E6F1FB; --blue-mid:#85B7EB; --blue-text:#0C447C; --blue-dark:#185FA5;
    --red-bg:#FCEBEB; --red-mid:#F09595; --red-text:#791F1F;
    --amber-bg:#FAEEDA; --amber-text:#633806;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#1c1c1a; --bg2:#272725; --bg3:#323230;
      --text:#f0f0ec; --text2:#a0a09c; --text3:#6a6a66;
      --border:rgba(255,255,255,0.09); --border2:rgba(255,255,255,0.16);
      --green-bg:#173404; --green-mid:#3B6D11; --green-text:#C0DD97; --green-dark:#97C459;
      --blue-bg:#042C53; --blue-mid:#185FA5; --blue-text:#B5D4F4; --blue-dark:#85B7EB;
      --red-bg:#501313; --red-mid:#A32D2D; --red-text:#F7C1C1;
      --amber-bg:#412402; --amber-text:#FAC775;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;}
  #root{max-width:820px;margin:0 auto;padding:16px;}

  select,input[type=number],input[type=text]{
    height:36px;border:0.5px solid var(--border2);border-radius:var(--radius);
    padding:0 10px;font-size:13px;background:var(--bg);color:var(--text);
    width:100%;outline:none;transition:border-color .15s,box-shadow .15s;font-family:inherit;
  }
  select:focus,input:focus{box-shadow:0 0 0 2px rgba(59,109,17,.2);border-color:var(--green-dark);}
  button{
    height:36px;border:0.5px solid var(--border2);border-radius:var(--radius);
    padding:0 14px;font-size:13px;background:var(--bg);color:var(--text);
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    transition:background .12s,transform .1s;font-family:inherit;white-space:nowrap;
  }
  button:hover{background:var(--bg2);}
  button:active{transform:scale(.98);}
  .btn-add{background:var(--green-bg);color:var(--green-text);border-color:var(--green-mid);font-weight:500;}
  .btn-add:hover{filter:brightness(.94);}
  .btn-reset{color:var(--red-text);border-color:var(--red-mid);background:var(--red-bg);}
  .btn-reset:hover{filter:brightness(.94);}
  .btn-edit{background:var(--blue-bg);color:var(--blue-text);border-color:var(--blue-mid);}
  .btn-edit:hover{filter:brightness(.94);}
  .btn-save{background:var(--blue-bg);color:var(--blue-text);border-color:var(--blue-mid);}
  .btn-ghost{background:var(--bg2);}
  .btn-wide{width:100%;justify-content:center;}
  .btn-sm{height:28px;padding:0 10px;font-size:12px;}
  .btn-icon{height:28px;width:28px;padding:0;justify-content:center;border-color:transparent;
    background:none;color:var(--text3);font-size:14px;border-radius:var(--radius);flex-shrink:0;}
  .btn-icon:hover{background:var(--red-bg);color:var(--red-text);border-color:var(--red-mid);}
  .btn-icon-b{color:var(--text3);}
  .btn-icon-b:hover{background:var(--blue-bg);color:var(--blue-text);border-color:var(--blue-mid);}

  .card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);}
  .cp{padding:14px 16px;}

  .header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;margin-bottom:14px;}
  .header-title{font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px;}
  .header-sub{font-size:11px;color:var(--text3);margin-top:2px;text-transform:capitalize;}
  .hactions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}

  .stats{display:flex;gap:10px;margin-bottom:14px;}
  .stat{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);
    padding:12px 16px;flex:1;text-align:center;}
  .stat-label{font-size:11px;color:var(--text2);margin-bottom:3px;}
  .stat-val{font-size:24px;font-weight:600;line-height:1.1;}
  .stat-unit{font-size:13px;font-weight:400;}

  .kcal{color:var(--green-dark);font-weight:500;}
  .prot{color:var(--blue-dark);font-weight:500;}

  .date-pills{display:flex;gap:5px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none;padding-bottom:2px;}
  .date-pills::-webkit-scrollbar{display:none;}
  .dpill{flex-direction:column;gap:1px;height:auto;padding:5px 12px;flex:0 0 auto;font-size:12px;border-radius:16px;}
  .dpill.active{background:var(--green-bg);color:var(--green-text);border-color:var(--green-mid);}
  .dpill.nodata{opacity:.5;}
  .dpill-sub{font-size:9px;color:var(--green-dark);display:block;text-align:center;}
  .dpill:not(.active) .dpill-sub{color:var(--text3);}

  .tabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{height:auto;padding:7px 11px;flex-direction:column;gap:2px;font-size:11px;
    min-width:68px;flex:0 0 auto;background:var(--bg);border-color:var(--border);}
  .tab-icon{font-size:17px;color:var(--text3);}
  .tab.active{background:var(--green-bg);color:var(--green-text);border-color:var(--green-mid);}
  .tab.active .tab-icon{color:var(--green-text);}
  .tab-sub{font-size:9px;color:var(--green-dark);}

  table{width:100%;border-collapse:collapse;}
  th{font-size:11px;font-weight:500;color:var(--text2);padding:6px 8px;text-align:right;
    background:var(--bg2);border-bottom:0.5px solid var(--border);}
  th:first-child{text-align:left;}
  td{padding:6px 8px;font-size:12px;text-align:right;border-bottom:0.5px solid var(--border);vertical-align:middle;}
  td:first-child{text-align:left;}
  tr:last-child td{border-bottom:none;}
  .tfoot td{border-top:0.5px solid var(--border2)!important;border-bottom:none!important;
    background:var(--bg2);font-weight:600;font-size:13px;}

  .preview{margin-top:7px;font-size:12px;color:var(--green-dark);background:var(--green-bg);
    border-radius:6px;padding:4px 10px;display:inline-block;}
  .empty{text-align:center;padding:2.5rem 1rem;color:var(--text3);font-size:13px;}
  .empty-icon{font-size:40px;display:block;margin-bottom:8px;opacity:.25;}
  .modified{background:var(--green-bg)!important;}
  .modified td:first-child{color:var(--green-text);}
  label{font-size:11px;color:var(--text2);display:block;margin-bottom:3px;}
  .sec-title{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:10px;
    display:flex;align-items:center;gap:6px;}
  .info-note{font-size:11px;color:var(--text2);line-height:1.6;padding:8px 10px;background:var(--bg2);
    border-radius:var(--radius);border-left:2px solid var(--border2);margin-bottom:12px;}
  .compact{height:28px!important;font-size:11px!important;padding:0 5px!important;}
  .compact-sel{height:28px!important;font-size:11px!important;padding:0 4px!important;}
  .day-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;
    border-bottom:0.5px solid var(--border);font-size:13px;}
  .day-row:last-child{border-bottom:none;}
  .hist-item{display:flex;justify-content:space-between;padding:3px 0 3px 22px;font-size:12px;color:var(--text3);}
  .divider{border:none;border-top:0.5px solid var(--border2);margin:8px 0;}
  .row-g{display:flex;gap:8px;}
  .col-g{display:flex;flex-direction:column;gap:8px;}
  .readonly-banner{background:var(--amber-bg);color:var(--amber-text);border:0.5px solid rgba(99,56,6,.25);
    border-radius:var(--radius);padding:7px 12px;font-size:12px;display:flex;align-items:center;
    gap:7px;margin-bottom:14px;}

  /* Edit rows */
  .edit-row{border-bottom:0.5px solid var(--border);}
  .edit-row:last-child{border-bottom:none;}
  .tag-custom{font-size:9px;padding:1px 5px;border-radius:4px;background:var(--blue-bg);
    color:var(--blue-text);font-weight:500;margin-left:4px;}
  .tag-base{font-size:9px;padding:1px 5px;border-radius:4px;background:var(--bg2);
    color:var(--text3);font-weight:500;margin-left:4px;}

  /* Color-coded edit inputs */
  .inp-kcal{border-color:var(--green-mid)!important;background:var(--green-bg)!important;color:var(--green-text)!important;}
  .inp-kcal::placeholder{color:var(--green-dark);opacity:.6;}
  .inp-kcal:focus{box-shadow:0 0 0 2px rgba(151,196,89,.3)!important;border-color:var(--green-dark)!important;}
  .inp-prot{border-color:var(--blue-mid)!important;background:var(--blue-bg)!important;color:var(--blue-text)!important;}
  .inp-prot::placeholder{color:var(--blue-dark);opacity:.6;}
  .inp-prot:focus{box-shadow:0 0 0 2px rgba(133,183,235,.3)!important;border-color:var(--blue-dark)!important;}

  /* Desktop edit grid */
  .edit-grid-desktop{display:grid;grid-template-columns:1fr 80px 65px 65px 80px 70px;gap:6px;padding:7px 12px;align-items:center;}
  /* Mobile edit card: 2-row layout */
  .edit-card-mob{padding:8px 12px;}
  .edit-row1{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
  .edit-row2{display:flex;gap:6px;}
  .edit-name{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  @media(min-width:600px){.edit-card-mob{display:none!important;}.edit-grid-desktop{display:grid!important;}}
  @media(max-width:599px){.edit-grid-desktop{display:none!important;}.edit-card-mob{display:block!important;}}

  /* Quick-add extras */
  .quick-add-grid{display:grid;grid-template-columns:1fr 72px 72px 72px;gap:6px;}
  @media(max-width:480px){.quick-add-grid{grid-template-columns:1fr 1fr;}}

  /* uds toggle */
  .toggle-pill{display:inline-flex;border:0.5px solid var(--border2);border-radius:20px;overflow:hidden;}
  .toggle-pill button{border:none;border-radius:0;background:none;height:28px;padding:0 10px;font-size:11px;color:var(--text2);}
  .toggle-pill button.on{background:var(--green-bg);color:var(--green-text);font-weight:500;}
  .toggle-pill button:first-child{border-right:0.5px solid var(--border2);}
  .toggle-pill button:hover{background:var(--bg2);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

/* ═══ STORAGE ════════════════════════════════════════════════════════════════ */
const LS = {
  get: k => { try { const v = localStorage.getItem(k); return v != null ? JSON.parse(v) : null; } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) { console.warn(e); } },
  del: k => { try { localStorage.removeItem(k); } catch {} },
};

/* ═══ FECHAS ══════════════════════════════════════════════════════════════════ */
const TODAY    = new Date().toISOString().slice(0, 10);
const MAX_HIST = 5;

function manageDates(stored) {
  let ds = [...new Set([TODAY, ...(stored || [])])].sort().reverse();
  const keep   = ds.slice(0, MAX_HIST + 1);
  const remove = ds.slice(MAX_HIST + 1);
  remove.forEach(d => LS.del('nutri_day_' + d));
  LS.set('nutri_dates', keep);
  return keep;
}

function fmtDate(ds) {
  if (ds === TODAY) return 'Hoy';
  const d    = new Date(ds + 'T12:00:00');
  const diff = Math.round((new Date(TODAY + 'T12:00:00') - d) / 86400000);
  if (diff === 1) return 'Ayer';
  return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
}

/* ═══ BASE DE ALIMENTOS (se ordenan alfabéticamente después) ══════════════════ */
const BASE_FOODS = [
  { id:'aguacate',     name:'Aguacate',                                unit:'g',   kcalPer100:160,  proteinPer100:2    },
  { id:'almendras',    name:'Almendras',                               unit:'g',   kcalPer100:586,  proteinPer100:24   },
  { id:'atun_natural', name:'Atún al natural',                         unit:'uds', kcalPer100:98,   proteinPer100:21,   gramsPerUnit:60 },
  { id:'atun_girasol', name:'Atún en aceite de girasol',               unit:'uds', kcalPer100:127,  proteinPer100:26,   gramsPerUnit:140 },
  { id:'atun_oliva',   name:'Atún en aceite de oliva',                 unit:'uds', kcalPer100:245,  proteinPer100:21,   gramsPerUnit:60  },
  { id:'cerdo',        name:'Carne de cerdo (bistec)',                 unit:'g',   kcalPer100:152,  proteinPer100:21   },
  { id:'ternera',      name:'Carne de ternera',                        unit:'g',   kcalPer100:122,  proteinPer100:22   },
  { id:'compota',      name:'Compota',                                 unit:'uds', kcalPer100:65,   proteinPer100:0.7,  gramsPerUnit:130 },
  { id:'ensalada',     name:'Ensalada (lechuga y tomate)',             unit:'g',   kcalPer100:17,   proteinPer100:0.9  },
  { id:'gazpacho',     name:'Gazpacho tradicional merc',               unit:'ml',  kcalPer100:40,   proteinPer100:0.9  },
  { id:'huevo',        name:'Huevo',                                   unit:'uds', kcalPer100:150,  proteinPer100:12.6, gramsPerUnit:60 },
  { id:'huevo_xl',     name:'Huevo XL',                                unit:'uds', kcalPer100:150,  proteinPer100:12.6, gramsPerUnit:75 },
  { id:'jamon',        name:'Jamón serrano',                           unit:'g',   kcalPer100:248,  proteinPer100:33.6   },
  { id:'leche_ent',    name:'Leche entera',                            unit:'ml',  kcalPer100:62,   proteinPer100:3  },
  { id:'leche_semi',   name:'Leche semidesnatada',                     unit:'ml',  kcalPer100:44,   proteinPer100:3  },
  { id:'noquis',       name:'Ñoquis',                                  unit:'gr',  kcalPer100:174,  proteinPer100:4.5  },
  { id:'pan',          name:'Pan integral Mercadona',                  unit:'uds', kcalPer100:227,  proteinPer100:12,   gramsPerUnit:28 },
  { id:'patata',       name:'Patata cocida',                           unit:'g',   kcalPer100:87,   proteinPer100:2    },
  { id:'pavo',         name:'Pavo (embutido)',                         unit:'g',   kcalPer100:100,  proteinPer100:18   },
  { id:'pina',         name:'Piña en jugo natural (lata)',             unit:'uds', kcalPer100:57,   proteinPer100:0.4,  gramsPerUnit:140 },
  { id:'platano',      name:'Plátano',                                 unit:'g',   kcalPer100:89,   proteinPer100:1.1  },
  { id:'pollo',        name:'Pollo (filetes)',                         unit:'g',   kcalPer100:120,  proteinPer100:25   },
  { id:'proteina',     name:'Proteína en polvo (whey)',                unit:'g',   kcalPer100:380,  proteinPer100:75   },
  { id:'tort_camp',    name:'Tortita arroz campesina (Mercadona)',     unit:'uds', kcalPer100:414,  proteinPer100:6.7,  gramsPerUnit:8.75  },
  { id:'tort_jamon',   name:'Tortita arroz jamón serrano (Mercadona)', unit:'uds', kcalPer100:417,  proteinPer100:7,    gramsPerUnit:8.75  },
];

const MEALS = [
  { id:'desayuno', name:'Desayuno',      icon:'ti-coffee'          },
  { id:'media',    name:'Media mañana',  icon:'ti-sun'             },
  { id:'almuerzo', name:'Almuerzo',      icon:'ti-tools-kitchen-2' },
  { id:'merienda', name:'Merienda',      icon:'ti-cookie'          },
  { id:'cena',     name:'Cena',          icon:'ti-moon'            },
  { id:'pre',      name:'Preentreno',    icon:'ti-bolt'            },
  { id:'post',     name:'Postentreno',   icon:'ti-barbell'         },
  { id:'extras',   name:'Extras',        icon:'ti-plus-circle'     },
];

const initMeals = () => Object.fromEntries(MEALS.map(m => [m.id, []]));

function sortFoods(arr) {
  return [...arr].sort((a, b) => a.name.localeCompare(b.name, 'es', { sensitivity: 'base' }));
}

/* ═══ CÁLCULO ════════════════════════════════════════════════════════════════ */
/*
  Lógica de unidades:
  - g / ml  → kcal = (amount / 100) * kcalPer100
  - uds     → kcal = amount * (gramsPerUnit / 100) * kcalPer100
              gramsPerUnit viene de la definición base o del override.
              Si no hay gramsPerUnit definido, tratamos kcalPer100 como kcal/unidad (legacy).
*/
function calcFood(food, amount, overrides) {
  const ov  = overrides?.[food.id] || {};
  const k   = ov.kcal         !== undefined ? +ov.kcal         : food.kcalPer100;
  const p   = ov.protein      !== undefined ? +ov.protein      : food.proteinPer100;
  const unt = ov.unit         !== undefined ? ov.unit          : food.unit;
  const gpu = ov.gramsPerUnit !== undefined ? +ov.gramsPerUnit
            : food.gramsPerUnit            ? +food.gramsPerUnit
            : null;

  if (unt === 'uds') {
    if (gpu) {
      return {
        kcal:    Math.round(amount * gpu / 100 * k),
        protein: Math.round(amount * gpu / 100 * p * 10) / 10,
      };
    }
    // legacy: kcalPer100 es kcal por unidad
    return { kcal: Math.round(amount * k), protein: Math.round(amount * p * 10) / 10 };
  }
  return {
    kcal:    Math.round(amount / 100 * k),
    protein: Math.round(amount / 100 * p * 10) / 10,
  };
}

function getEffUnit(food, overrides) {
  return overrides?.[food.id]?.unit ?? food.unit;
}

function enrichItems(items, allFoods, overrides) {
  return items.map(item => {
    if (item._fixed) return item;  // pre-calculated (quick extra or direct-g uds)
    const f = allFoods.find(x => x.id === item.foodId);
    if (!f) return { ...item, kcal: item.kcal || 0, protein: item.protein || 0 };
    return { ...item, ...calcFood(f, item.amount, overrides) };
  });
}

function mealTotals(items) {
  return {
    kcal:    items.reduce((s, i) => s + i.kcal, 0),
    protein: Math.round(items.reduce((s, i) => s + i.protein, 0) * 10) / 10,
    count:   items.length,
  };
}

function buildDayTotals(mealData, allFoods, overrides) {
  const breakdown = {};
  let kcal = 0, prot = 0;
  MEALS.forEach(ml => {
    const items = enrichItems(mealData[ml.id] || [], allFoods, overrides);
    const t     = mealTotals(items);
    breakdown[ml.id] = { ...t, items };
    kcal += t.kcal;
    prot += t.protein;
  });
  return { kcal, protein: Math.round(prot * 10) / 10, meals: breakdown };
}

/* ═══ COMPONENTE: EDITOR DE ALIMENTOS ═══════════════════════════════════════ */
function EditView({ allFoods, overrides, setOverrides, custom, setCustom, deletedFoods, setDeletedFoods, onBack }) {
  const [search, setSearch]       = useState('');
  const [confirmDel, setConfirmDel] = useState(null);

  // Include deleted base foods so user can see and restore them
  const allWithDeleted = useMemo(() => {
    const deletedBase = BASE_FOODS.filter(f => deletedFoods.includes(f.id));
    return sortFoods([...allFoods, ...deletedBase]);
  }, [allFoods, deletedFoods]);

  const filtered = search
    ? allWithDeleted.filter(f => f.name.toLowerCase().includes(search.toLowerCase()))
    : allWithDeleted;

  const isBase    = id => BASE_FOODS.some(f => f.id === id);
  const isDeleted = id => deletedFoods.includes(id);

  const setOv = (id, field, val) =>
    setOverrides(p => ({
      ...p,
      [id]: { ...(p[id] || {}), [field]: val === '' ? undefined : val },
    }));

  const changeUnit = (food, newUnit) => {
    setOverrides(p => {
      const existing = { ...(p[food.id] || {}) };
      if (newUnit === food.unit) {
        delete existing.unit;
        delete existing.gramsPerUnit;
      } else {
        existing.unit = newUnit;
        if (newUnit !== 'uds') delete existing.gramsPerUnit;
      }
      return { ...p, [food.id]: existing };
    });
  };

  const resetOv = id =>
    setOverrides(p => { const n = { ...p }; delete n[id]; return n; });

  const deleteFood = id => {
    if (isBase(id)) {
      // Ocultar alimento base (se puede restaurar)
      setDeletedFoods(p => [...p, id]);
    } else {
      // Eliminar alimento personalizado definitivamente
      setCustom(p => p.filter(f => f.id !== id));
      setOverrides(p => { const n = { ...p }; delete n[id]; return n; });
    }
    setConfirmDel(null);
  };

  const restoreFood = id => {
    setDeletedFoods(p => p.filter(x => x !== id));
  };

  const hasOverrides = id => {
    const ov = overrides[id];
    return ov && Object.values(ov).some(v => v !== undefined);
  };

  return (
    <div style={{ paddingBottom: '2rem' }}>
      {/* Header */}
      <div className="card cp header">
        <div>
          <div className="header-title">
            <i className="ti ti-edit" style={{ color: 'var(--blue-dark)', fontSize: 18 }}></i>
            Editar lista de alimentos
          </div>
          <div style={{ fontSize: 11, color: 'var(--text3)', marginTop: 2 }}>
            {allFoods.length} activos · {deletedFoods.length} ocultos
          </div>
        </div>
        <div className="hactions">
          <button className="btn-edit" onClick={onBack}>
            <i className="ti ti-arrow-left"></i> Volver
          </button>
        </div>
      </div>

      {/* Info + leyenda de colores */}
      <div className="info-note">
        <i className="ti ti-info-circle" style={{ fontSize: 13 }}></i>{' '}
        Cambia la unidad de medida y los valores nutricionales por 100g/ml. Si usas <strong>unidades</strong>,
        indica los <strong>gramos por unidad</strong> para un cálculo exacto.
        Los alimentos <strong>base</strong> eliminados se ocultan y pueden restaurarse. Los <strong>personalizados</strong> se eliminan definitivamente.
        <div style={{ display:'flex', gap:6, marginTop:8, flexWrap:'wrap' }}>
          <div style={{ display:'flex', alignItems:'center', gap:5 }}>
            <input readOnly className="compact inp-kcal" style={{ width:60, textAlign:'right', pointerEvents:'none' }} placeholder="Kcal" />
            <span style={{ fontSize:11, color:'var(--text2)' }}>= Kcal por 100g/ml/ud</span>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:5 }}>
            <input readOnly className="compact inp-prot" style={{ width:60, textAlign:'right', pointerEvents:'none' }} placeholder="Prot." />
            <span style={{ fontSize:11, color:'var(--text2)' }}>= Proteína por 100g/ml/ud</span>
          </div>
        </div>
      </div>

      <input type="text" placeholder="Buscar alimento..." value={search}
        onChange={e => setSearch(e.target.value)} style={{ marginBottom: 10 }} />

      {/* Lista */}
      <div className="card" style={{ overflow: 'hidden', marginBottom: 14 }}>
        {/* Cabecera DESKTOP únicamente */}
        <div className="edit-grid-desktop" style={{
          background: 'var(--bg2)', borderBottom: '0.5px solid var(--border)',
          fontSize: 10, fontWeight: 500, color: 'var(--text2)',
        }}>
          <span>Alimento</span>
          <span style={{ textAlign: 'center' }}>Unidad</span>
          <span style={{ textAlign: 'right' }}>Kcal/100</span>
          <span style={{ textAlign: 'right' }}>Prot./100</span>
          <span style={{ textAlign: 'center' }}>g/ud.</span>
          <span style={{ textAlign: 'center' }}>Acciones</span>
        </div>

        {filtered.length === 0 && (
          <div style={{ textAlign: 'center', padding: '16px', color: 'var(--text3)', fontSize: 13 }}>
            Sin resultados
          </div>
        )}

        {filtered.map(f => {
          const ov      = overrides[f.id] || {};
          const effUnit = ov.unit !== undefined ? ov.unit : f.unit;
          const isUds   = effUnit === 'uds';
          const base    = isBase(f.id);
          const deleted = isDeleted(f.id);
          const hasOv   = hasOverrides(f.id);

          // Confirmación de borrado
          if (confirmDel === f.id) {
            return (
              <div key={f.id} style={{
                display: 'flex', alignItems: 'center', gap: 10, padding: '8px 12px',
                background: 'var(--red-bg)', borderBottom: '0.5px solid var(--border)', flexWrap:'wrap',
              }}>
                <i className="ti ti-alert-triangle" style={{ color: 'var(--red-text)', fontSize: 15 }}></i>
                <span style={{ flex: 1, fontSize: 12, color: 'var(--red-text)', minWidth: 140 }}>
                  {base
                    ? <>¿Ocultar <strong>{f.name}</strong>? Podrás restaurarlo.</>
                    : <>¿Eliminar <strong>{f.name}</strong>? No se puede deshacer.</>
                  }
                </span>
                <button className="btn-sm btn-reset" onClick={() => deleteFood(f.id)}>
                  <i className="ti ti-trash"></i> {base ? 'Ocultar' : 'Eliminar'}
                </button>
                <button className="btn-sm btn-ghost" onClick={() => setConfirmDel(null)}>
                  Cancelar
                </button>
              </div>
            );
          }

          // Campos reutilizables
          const kcalInp = (
            <input type="number" className="compact inp-kcal" min="0" style={{ textAlign:'right', width:'100%' }}
              disabled={deleted}
              placeholder={String(f.kcalPer100)}
              value={ov.kcal !== undefined ? ov.kcal : ''}
              onChange={e => setOv(f.id, 'kcal', e.target.value)} />
          );
          const protInp = (
            <input type="number" className="compact inp-prot" min="0" step="0.1" style={{ textAlign:'right', width:'100%' }}
              disabled={deleted}
              placeholder={String(f.proteinPer100)}
              value={ov.protein !== undefined ? ov.protein : ''}
              onChange={e => setOv(f.id, 'protein', e.target.value)} />
          );
          const gpuInp = isUds && !deleted ? (
            <input type="number" className="compact" min="0" style={{ textAlign:'right', width:'100%' }}
              placeholder={f.gramsPerUnit ? String(f.gramsPerUnit) : 'g/ud'}
              value={ov.gramsPerUnit !== undefined ? ov.gramsPerUnit : ''}
              onChange={e => setOv(f.id, 'gramsPerUnit', e.target.value)} />
          ) : (
            <span style={{ fontSize:11, color:'var(--text3)', display:'block', textAlign:'center' }}>—</span>
          );
          const unitSel = (
            <select className="compact-sel" value={effUnit} disabled={deleted}
              onChange={e => changeUnit(f, e.target.value)} style={{ width:'100%' }}>
              <option value="g">g</option>
              <option value="ml">ml</option>
              <option value="uds">uds</option>
            </select>
          );
          const actionsBtns = deleted ? (
            <button className="btn-icon btn-icon-b" title="Restaurar alimento" onClick={() => restoreFood(f.id)}>
              <i className="ti ti-restore"></i>
            </button>
          ) : (
            <>
              {hasOv && (
                <button className="btn-icon btn-icon-b" title="Restaurar valores originales" onClick={() => resetOv(f.id)}>
                  <i className="ti ti-refresh"></i>
                </button>
              )}
              <button className="btn-icon" title={base ? 'Ocultar alimento' : 'Eliminar alimento'} onClick={() => setConfirmDel(f.id)}>
                <i className="ti ti-trash"></i>
              </button>
            </>
          );

          const udsHint = isUds && !deleted ? (
            <div style={{ fontSize:10.5, color:'var(--amber-text)', display:'flex', alignItems:'center', gap:4, marginTop:4 }}>
              <i className="ti ti-info-circle" style={{ fontSize:12 }}></i>
              {(() => {
                const gpu = ov.gramsPerUnit !== undefined ? +ov.gramsPerUnit : (f.gramsPerUnit || null);
                const k   = ov.kcal    !== undefined ? +ov.kcal    : f.kcalPer100;
                const p   = ov.protein !== undefined ? +ov.protein : f.proteinPer100;
                if (gpu) return `1 unidad = ${gpu}g → ${Math.round(gpu/100*k)} kcal · ${Math.round(gpu/100*p*10)/10}g prot.`;
                return 'Indica los gramos por unidad para un cálculo preciso.';
              })()}
            </div>
          ) : null;

          return (
            <div key={f.id} className="edit-row" style={{ opacity: deleted ? 0.45 : 1 }}>

              {/* ── DESKTOP ── */}
              <div className="edit-grid-desktop">
                <div style={{ overflow:'hidden' }}>
                  <span style={{ fontSize:12, display:'block', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                    {f.name}
                    <span className={base ? 'tag-base' : 'tag-custom'}>{base ? 'base' : 'custom'}</span>
                    {deleted && <span style={{ fontSize:9, color:'var(--red-text)', marginLeft:4, fontWeight:500 }}>OCULTO</span>}
                  </span>
                </div>
                <div>{unitSel}</div>
                <div>{kcalInp}</div>
                <div>{protInp}</div>
                <div>{gpuInp}</div>
                <div style={{ display:'flex', gap:2, justifyContent:'center' }}>{actionsBtns}</div>
              </div>
              {/* uds hint desktop */}
              {isUds && !deleted && (
                <div style={{ padding:'0 12px 7px', fontSize:10.5, color:'var(--amber-text)', display:'flex', alignItems:'center', gap:5 }}
                  className="edit-grid-desktop" >
                  {udsHint}
                </div>
              )}

              {/* ── MÓVIL ── */}
              <div className="edit-card-mob">
                {/* Fila 1: nombre | unidad | g/ud | acciones */}
                <div className="edit-row1">
                  <span className="edit-name">
                    {f.name}
                    <span className={base ? 'tag-base' : 'tag-custom'}>{base ? 'base' : 'custom'}</span>
                    {deleted && <span style={{ fontSize:9, color:'var(--red-text)', marginLeft:4, fontWeight:500 }}>OCULTO</span>}
                  </span>
                  <div style={{ width:60, flexShrink:0 }}>{unitSel}</div>
                  <div style={{ width:56, flexShrink:0 }}>{isUds && !deleted ? gpuInp : <span style={{fontSize:11,color:'var(--text3)',display:'block',textAlign:'center'}}>—</span>}</div>
                  <div style={{ display:'flex', gap:2, flexShrink:0 }}>{actionsBtns}</div>
                </div>
                {/* Fila 2: kcal | prot */}
                {!deleted && (
                  <div className="edit-row2">
                    <div style={{ flex:1 }}>{kcalInp}</div>
                    <div style={{ flex:1 }}>{protInp}</div>
                  </div>
                )}
                {udsHint}
              </div>

            </div>
          );
        })}
      </div>

      <div style={{ fontSize: 11, color: 'var(--text3)', textAlign: 'center' }}>
        {allFoods.length} activos · {deletedFoods.length} oculto{deletedFoods.length !== 1 ? 's' : ''} · {custom.length} personalizado{custom.length !== 1 ? 's' : ''}
      </div>
    </div>
  );
}

/* ═══ COMPONENTE: VISTA HISTÓRICO ════════════════════════════════════════════ */
function HistoryView({ data }) {
  if (!data || (data.kcal === 0 && data.protein === 0)) {
    return (
      <div className="card" style={{ marginBottom: 10 }}>
        <div className="empty">
          <i className="ti ti-calendar-off empty-icon"></i>
          Sin datos registrados para este día
        </div>
      </div>
    );
  }
  return (
    <>
      <div className="stats">
        <div className="stat">
          <div className="stat-label">Calorías</div>
          <div className="stat-val kcal">{data.kcal} <span className="stat-unit">kcal</span></div>
        </div>
        <div className="stat">
          <div className="stat-label">Proteínas</div>
          <div className="stat-val prot">{data.protein} <span className="stat-unit">g</span></div>
        </div>
      </div>
      <div className="card cp" style={{ marginBottom: 14 }}>
        <div className="sec-title">
          <i className="ti ti-history"></i> Detalle por comida
        </div>
        {MEALS.map(ml => {
          const m = data.meals[ml.id];
          if (!m || !m.count) return null;
          return (
            <div key={ml.id} style={{ marginBottom: 6 }}>
              <div className="day-row">
                <span style={{ display:'flex', alignItems:'center', gap:5, color:'var(--text2)', fontSize:13 }}>
                  <i className={`ti ${ml.icon}`} style={{ fontSize:13 }}></i>
                  {ml.name}
                  <span style={{ fontSize:10, color:'var(--text3)' }}>({m.count} alim.)</span>
                </span>
                <span>
                  <span className="kcal">{m.kcal} kcal</span>
                  <span style={{ color:'var(--text3)', margin:'0 4px' }}>·</span>
                  <span className="prot">{m.protein}g</span>
                </span>
              </div>
              {m.items.map(item => (
                <div key={item.id} className="hist-item">
                  <span>{item.name} <span style={{ color:'var(--text3)' }}>({item.amount} {item.unit})</span></span>
                  <span>
                    <span style={{ color:'var(--green-dark)' }}>{item.kcal} kcal</span>
                    <span style={{ color:'var(--text3)', margin:'0 3px' }}>·</span>
                    <span style={{ color:'var(--blue-dark)' }}>{item.protein}g</span>
                  </span>
                </div>
              ))}
            </div>
          );
        })}
        <hr className="divider" />
        <div style={{ display:'flex', justifyContent:'space-between', fontWeight:600, fontSize:14 }}>
          <span>TOTAL</span>
          <span>
            <span className="kcal">{data.kcal} kcal</span>
            <span style={{ color:'var(--text3)', margin:'0 4px' }}>·</span>
            <span className="prot">{data.protein}g prot.</span>
          </span>
        </div>
      </div>
    </>
  );
}

/* ═══ APP PRINCIPAL ══════════════════════════════════════════════════════════ */
function App() {
  const [loading,      setLoading]      = useState(true);
  const [meals,        setMeals]        = useState(initMeals);
  const [custom,       setCustom]       = useState([]);
  const [deletedFoods, setDeletedFoods] = useState([]);   // IDs ocultos (base o custom)
  const [overrides,    setOverrides]    = useState({});
  const [history,      setHistory]      = useState({});
  const [dates,        setDates]        = useState([TODAY]);
  const [viewDate,     setViewDate]     = useState(TODAY);
  const [active,       setActive]       = useState('desayuno');
  const [selFood,      setSelFood]      = useState(BASE_FOODS[0].id);
  const [amt,          setAmt]          = useState('');
  const [showAdd,      setShowAdd]      = useState(false);
  const [editMode,     setEditMode]     = useState(false);
  const [newF,         setNewF]         = useState({ name:'', unit:'g', kcal:'', protein:'', gramsPerUnit:'' });
  const [extraQuick,   setExtraQuick]   = useState({ name:'', kcal:'', protein:'', qty:'' });
  const [udsMode,      setUdsMode]      = useState('uds');  // 'uds' | 'g' for unit foods

  /* ── Carga inicial ── */
  useEffect(() => {
    const ds        = manageDates(LS.get('nutri_dates') || []);
    const customF   = LS.get('nutri_foods')    || [];
    const ovs       = LS.get('nutri_overrides') || {};
    const deleted   = LS.get('nutri_deleted')  || [];
    const todayD    = LS.get('nutri_day_' + TODAY);
    const hist = {};
    ds.filter(d => d !== TODAY).forEach(d => { const data = LS.get('nutri_day_' + d); if (data) hist[d] = data; });
    setDates(ds);
    setCustom(customF);
    setOverrides(ovs);
    setDeletedFoods(deleted);
    if (todayD) setMeals(todayD);
    setHistory(hist);
    setLoading(false);
  }, []);

  /* ── Guardado automático ── */
  const saveTimer = useRef(null);
  useEffect(() => {
    if (loading) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => LS.set('nutri_day_' + TODAY, meals), 300);
  }, [meals, loading]);
  useEffect(() => { if (!loading) LS.set('nutri_overrides', overrides);       }, [overrides,    loading]);
  useEffect(() => { if (!loading) LS.set('nutri_foods',     custom);          }, [custom,       loading]);
  useEffect(() => { if (!loading) LS.set('nutri_deleted',   deletedFoods);    }, [deletedFoods, loading]);

  /* ── Datos derivados ── */
  const allFoods = useMemo(
    () => sortFoods([...BASE_FOODS, ...custom].filter(f => !deletedFoods.includes(f.id))),
    [custom, deletedFoods]
  );
  const food     = allFoods.find(f => f.id === selFood) || allFoods[0];
  const effUnit  = food ? getEffUnit(food, overrides) : 'g';

  const enrichedToday = useMemo(() => {
    const r = {};
    Object.entries(meals).forEach(([mid, items]) => { r[mid] = enrichItems(items, allFoods, overrides); });
    return r;
  }, [meals, overrides, allFoods]);

  const todayMealT = useMemo(() =>
    Object.fromEntries(MEALS.map(ml => [ml.id, mealTotals(enrichedToday[ml.id] || [])])),
    [enrichedToday]
  );

  const todayDay = useMemo(() => ({
    kcal:    Object.values(todayMealT).reduce((s, m) => s + m.kcal, 0),
    protein: Math.round(Object.values(todayMealT).reduce((s, m) => s + m.protein, 0) * 10) / 10,
  }), [todayMealT]);

  const histData = useMemo(() => {
    const r = {};
    Object.entries(history).forEach(([d, data]) => { r[d] = buildDayTotals(data, allFoods, overrides); });
    return r;
  }, [history, allFoods, overrides]);

  /* ── Handlers ── */
  const addItem = () => {
    const n = +amt;
    if (!n || n <= 0 || !food) return;
    // For uds foods: if user chose to enter grams directly, override unit to 'g' for this entry
    const resolvedUnit = effUnit === 'uds' && udsMode === 'g' ? 'g' : effUnit;
    // Build a synthetic food override for direct-grams entry on a uds food
    let entryKcal, entryProt;
    if (effUnit === 'uds' && udsMode === 'g') {
      // calculate as grams
      const ov = overrides?.[food.id] || {};
      const k  = ov.kcal    !== undefined ? +ov.kcal    : food.kcalPer100;
      const p  = ov.protein !== undefined ? +ov.protein : food.proteinPer100;
      entryKcal    = Math.round(n / 100 * k);
      entryProt    = Math.round(n / 100 * p * 10) / 10;
    } else {
      const res = calcFood(food, n, overrides);
      entryKcal    = res.kcal;
      entryProt    = res.protein;
    }
    setMeals(p => ({
      ...p,
      [active]: [...p[active], {
        id: Date.now(), foodId: food.id, name: food.name,
        amount: n, unit: resolvedUnit,
        kcal: entryKcal, protein: entryProt,
        _fixed: true,   // mark as pre-calculated so enrichItems skips recalc
      }],
    }));
    setAmt('');
  };

  const addQuickExtra = () => {
    const { name, kcal, protein, qty } = extraQuick;
    const n = +qty, k = +kcal, p = +protein;
    if (!name || !k || !p || !n || n <= 0) return;
    const itemKcal = Math.round(n / 100 * k);
    const itemProt = Math.round(n / 100 * p * 10) / 10;
    setMeals(prev => ({
      ...prev,
      extras: [...prev.extras, {
        id: Date.now(), foodId: '__quick__', name, amount: n, unit: 'g',
        kcal: itemKcal, protein: itemProt, _fixed: true,
      }],
    }));
    setExtraQuick({ name:'', kcal:'', protein:'', qty:'' });
  };

  const delItem = (mid, id) => setMeals(p => ({ ...p, [mid]: p[mid].filter(i => i.id !== id) }));

  const saveCustom = () => {
    if (!newF.name || !newF.kcal || !newF.protein) return;
    const nf = {
      id: 'c' + Date.now(),
      name: newF.name,
      unit: newF.unit,
      kcalPer100:    +newF.kcal,
      proteinPer100: +newF.protein,
      ...(newF.unit === 'uds' && newF.gramsPerUnit ? { gramsPerUnit: +newF.gramsPerUnit } : {}),
    };
    setCustom(p => p.concat(nf));
    setSelFood(nf.id);
    setNewF({ name:'', unit:'g', kcal:'', protein:'', gramsPerUnit:'' });
    setShowAdd(false);
  };

  /* ── Render ── */
  if (loading) {
    return (
      <div style={{ textAlign:'center', padding:'3rem', color:'var(--text2)' }}>
        <i className="ti ti-loader" style={{ fontSize:28, display:'block', marginBottom:8, opacity:.35 }}></i>
        Cargando datos...
      </div>
    );
  }

  if (editMode) {
    return (
      <EditView
        allFoods={allFoods}
        overrides={overrides}
        setOverrides={setOverrides}
        custom={custom}
        setCustom={setCustom}
        deletedFoods={deletedFoods}
        setDeletedFoods={setDeletedFoods}
        onBack={() => setEditMode(false)}
      />
    );
  }

  const isToday    = viewDate === TODAY;
  const curItems   = enrichedToday[active] || [];
  const curTotals  = todayMealT[active];
  const activeMeal = MEALS.find(m => m.id === active);
  const preview    = amt && +amt > 0 && food ? calcFood(food, +amt, overrides) : null;
  const hasDayData = Object.values(todayMealT).some(t => t.count > 0);
  const todayLabel = new Date().toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' });

  return (
    <div style={{ paddingBottom: '2rem' }}>

      {/* HEADER */}
      <div className="card cp header">
        <div>
          <div className="header-title">
            <i className="ti ti-leaf" style={{ color:'var(--green-dark)', fontSize:19 }}></i>
            Contador Nutricional
          </div>
          <div className="header-sub">{todayLabel}</div>
        </div>
        <div className="hactions">
          <button className="btn-edit" onClick={() => setEditMode(true)}>
            <i className="ti ti-edit"></i>
            Editar alimentos
          </button>
          {isToday && (
            <button className="btn-reset" onClick={() => setMeals(initMeals())}>
              <i className="ti ti-refresh"></i> Reiniciar hoy
            </button>
          )}
        </div>
      </div>

      {/* DATE PILLS */}
      <div className="date-pills">
        {dates.map(d => {
          const pd      = d === TODAY ? todayDay : (histData[d] || { kcal:0, protein:0 });
          const hasData = pd.kcal > 0 || pd.protein > 0;
          return (
            <button key={d}
              className={`tab dpill ${viewDate === d ? 'active' : ''} ${!hasData ? 'nodata' : ''}`}
              onClick={() => setViewDate(d)}>
              <span>{fmtDate(d)}</span>
              {hasData && <span className="dpill-sub">{pd.kcal}kcal · {pd.protein}g</span>}
            </button>
          );
        })}
      </div>

      {/* BANNER SOLO LECTURA */}
      {!isToday && (
        <div className="readonly-banner">
          <i className="ti ti-eye" style={{ fontSize:15 }}></i>
          Viendo {fmtDate(viewDate).toLowerCase()} — solo lectura.
          <button style={{ marginLeft:'auto', height:26, padding:'0 10px', fontSize:11 }} onClick={() => setViewDate(TODAY)}>
            Ir a hoy
          </button>
        </div>
      )}

      {/* VISTA HOY */}
      {isToday && (<>

        <div className="stats">
          <div className="stat">
            <div className="stat-label">Calorías del día</div>
            <div className="stat-val kcal">{todayDay.kcal} <span className="stat-unit">kcal</span></div>
          </div>
          <div className="stat">
            <div className="stat-label">Proteínas del día</div>
            <div className="stat-val prot">{todayDay.protein} <span className="stat-unit">g</span></div>
          </div>
        </div>

        {/* Meal tabs */}
        <div className="tabs">
          {MEALS.map(ml => {
            const t = todayMealT[ml.id];
            return (
              <button key={ml.id} className={`tab ${active === ml.id ? 'active' : ''}`}
                onClick={() => setActive(ml.id)}>
                <i className={`ti ${ml.icon} tab-icon`}></i>
                {ml.name}
                {t.count > 0 && <span className="tab-sub">{t.kcal}kcal·{t.protein}g</span>}
              </button>
            );
          })}
        </div>

        {/* Añadir alimento */}
        <div className="card cp" style={{ marginBottom:10 }}>
          <div className="sec-title">
            <i className={`ti ${activeMeal?.icon}`}></i>
            {activeMeal?.name} — Añadir alimento
          </div>
          <div className="row-g" style={{ flexWrap:'wrap' }}>
            <div style={{ flex:'2 1 180px' }}>
              <select value={selFood} onChange={e => { setSelFood(e.target.value); setUdsMode('uds'); }}>
                <optgroup label="── Alimentos base ──">
                  {sortFoods(BASE_FOODS.filter(f => !deletedFoods.includes(f.id))).map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
                </optgroup>
                {custom.length > 0 && (
                  <optgroup label="── Alimentos personalizados ──">
                    {sortFoods(custom.filter(f => !deletedFoods.includes(f.id))).map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
                  </optgroup>
                )}
              </select>
            </div>
            {/* Toggle unidades/gramos para alimentos medidos en uds */}
            {effUnit === 'uds' && (
              <div className="toggle-pill" style={{ alignSelf:'center' }}>
                <button className={udsMode === 'uds' ? 'on' : ''} onClick={() => setUdsMode('uds')}>uds</button>
                <button className={udsMode === 'g' ? 'on' : ''} onClick={() => setUdsMode('g')}>g</button>
              </div>
            )}
            <div style={{ flex:'1 1 90px', display:'flex', alignItems:'center', gap:5 }}>
              <input type="number" min="0"
                placeholder={effUnit === 'uds' ? (udsMode === 'g' ? 'g' : 'uds') : effUnit}
                value={amt} onChange={e => setAmt(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && addItem()} />
              <span style={{ fontSize:11, color:'var(--text3)', minWidth:28 }}>
                {effUnit === 'uds' ? udsMode : effUnit}
              </span>
            </div>
            <button className="btn-add" onClick={addItem} style={{ flex:'0 0 auto' }}>
              <i className="ti ti-plus"></i> Añadir
            </button>
          </div>
          {preview && effUnit !== 'uds' && (
            <div className="preview">
              <i className="ti ti-arrow-right" style={{ fontSize:11 }}></i>{' '}
              <span className="kcal">{preview.kcal} kcal</span>{' · '}
              <span className="prot">{preview.protein}g proteína</span>
            </div>
          )}
          {effUnit === 'uds' && amt && +amt > 0 && (() => {
            const ov = overrides?.[food?.id] || {};
            const k  = ov.kcal    !== undefined ? +ov.kcal    : (food?.kcalPer100 || 0);
            const p  = ov.protein !== undefined ? +ov.protein : (food?.proteinPer100 || 0);
            const gpu = ov.gramsPerUnit !== undefined ? +ov.gramsPerUnit : (food?.gramsPerUnit || null);
            const n  = +amt;
            let eKcal, eProt;
            if (udsMode === 'g') {
              eKcal = Math.round(n / 100 * k); eProt = Math.round(n / 100 * p * 10) / 10;
            } else if (gpu) {
              eKcal = Math.round(n * gpu / 100 * k); eProt = Math.round(n * gpu / 100 * p * 10) / 10;
            } else { return null; }
            return (
              <div className="preview">
                <i className="ti ti-arrow-right" style={{ fontSize:11 }}></i>{' '}
                <span className="kcal">{eKcal} kcal</span>{' · '}
                <span className="prot">{eProt}g proteína</span>
              </div>
            );
          })()}
        </div>

        {/* Tabla de alimentos */}
        {curItems.length > 0 ? (
          <div className="card" style={{ marginBottom:10, overflow:'hidden' }}>
            <table style={{ tableLayout:'fixed' }}>
              <colgroup>
                <col style={{ width:'44%' }} /><col style={{ width:'18%' }} />
                <col style={{ width:'16%' }} /><col style={{ width:'14%' }} /><col style={{ width:'8%' }} />
              </colgroup>
              <thead>
                <tr><th>Alimento</th><th>Cantidad</th><th>Kcal</th><th>Prot.</th><th></th></tr>
              </thead>
              <tbody>
                {curItems.map(item => (
                  <tr key={item.id}>
                    <td style={{ overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', maxWidth:0, fontSize:12 }}>{item.name}</td>
                    <td style={{ color:'var(--text2)', fontSize:12 }}>{item.amount} {item.unit}</td>
                    <td className="kcal">{item.kcal}</td>
                    <td className="prot" style={{ fontSize:12 }}>{item.protein}g</td>
                    <td style={{ textAlign:'center' }}>
                      <button className="btn-icon" onClick={() => delItem(active, item.id)} aria-label="Eliminar">
                        <i className="ti ti-x"></i>
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
              <tfoot>
                <tr>
                  <td colSpan={2} className="tfoot">Total {activeMeal?.name}</td>
                  <td className="kcal tfoot">{curTotals.kcal} kcal</td>
                  <td className="prot tfoot" style={{ fontSize:12 }}>{curTotals.protein}g</td>
                  <td className="tfoot"></td>
                </tr>
              </tfoot>
            </table>
          </div>
        ) : (
          <div className="card" style={{ marginBottom:10 }}>
            <div className="empty">
              <i className="ti ti-bowl-chopsticks empty-icon"></i>
              Sin alimentos en {activeMeal?.name.toLowerCase()}
            </div>
          </div>
        )}

        {/* Quick-add para Extras */}
        {active === 'extras' && (
          <div className="card cp" style={{ marginBottom:10 }}>
            <div className="sec-title">
              <i className="ti ti-pencil-plus"></i>
              Añadir comida esporádica (sin guardar)
            </div>
            <div style={{ fontSize:11, color:'var(--text3)', marginBottom:8, lineHeight:1.5 }}>
              Introduce los datos manualmente. No se guardará en la lista de alimentos.
            </div>
            <div className="quick-add-grid" style={{ marginBottom:7 }}>
              <input type="text" placeholder="Nombre"
                value={extraQuick.name} onChange={e => setExtraQuick(p => ({ ...p, name: e.target.value }))} />
              <input type="number" className="inp-kcal" min="0" placeholder="Kcal/100g"
                value={extraQuick.kcal} onChange={e => setExtraQuick(p => ({ ...p, kcal: e.target.value }))} />
              <input type="number" className="inp-prot" min="0" step="0.1" placeholder="Prot/100g"
                value={extraQuick.protein} onChange={e => setExtraQuick(p => ({ ...p, protein: e.target.value }))} />
              <input type="number" min="0" placeholder="Gramos"
                value={extraQuick.qty}
                onChange={e => setExtraQuick(p => ({ ...p, qty: e.target.value }))}
                onKeyDown={e => e.key === 'Enter' && addQuickExtra()} />
            </div>
            {extraQuick.kcal && extraQuick.protein && extraQuick.qty && +extraQuick.qty > 0 && (
              <div className="preview" style={{ marginBottom:7 }}>
                <i className="ti ti-arrow-right" style={{ fontSize:11 }}></i>{' '}
                <span className="kcal">{Math.round(+extraQuick.qty/100*+extraQuick.kcal)} kcal</span>{' · '}
                <span className="prot">{Math.round(+extraQuick.qty/100*+extraQuick.protein*10)/10}g proteína</span>
              </div>
            )}
            <button className="btn-add" onClick={addQuickExtra} style={{ width:'100%', justifyContent:'center' }}>
              <i className="ti ti-plus"></i> Añadir a Extras
            </button>
          </div>
        )}

        {/* Resumen del día */}
        {hasDayData && (
          <div className="card cp" style={{ marginBottom:10 }}>
            <div className="sec-title">
              <i className="ti ti-calendar-stats"></i> Resumen completo del día
            </div>
            {MEALS.map(ml => {
              const t = todayMealT[ml.id];
              if (!t.count) return null;
              return (
                <div className="day-row" key={ml.id}>
                  <span style={{ display:'flex', alignItems:'center', gap:5, color:'var(--text2)' }}>
                    <i className={`ti ${ml.icon}`} style={{ fontSize:13 }}></i>
                    {ml.name}
                  </span>
                  <span>
                    <span className="kcal">{t.kcal} kcal</span>
                    <span style={{ color:'var(--text3)', margin:'0 4px' }}>·</span>
                    <span className="prot">{t.protein}g</span>
                  </span>
                </div>
              );
            })}
            <hr className="divider" />
            <div style={{ display:'flex', justifyContent:'space-between', fontWeight:600, fontSize:14 }}>
              <span>TOTAL DEL DÍA</span>
              <span>
                <span className="kcal">{todayDay.kcal} kcal</span>
                <span style={{ color:'var(--text3)', margin:'0 4px' }}>·</span>
                <span className="prot">{todayDay.protein}g proteína</span>
              </span>
            </div>
          </div>
        )}

        {/* Añadir alimento personalizado */}
        <button className="btn-wide" style={{ marginBottom:8 }} onClick={() => setShowAdd(!showAdd)}>
          <i className={`ti ${showAdd ? 'ti-x' : 'ti-circle-plus'}`}></i>
          {showAdd ? 'Cancelar' : 'Agregar alimento personalizado'}
        </button>

        {showAdd && (
          <div className="card cp" style={{ marginBottom:10 }}>
            <div className="sec-title">
              <i className="ti ti-circle-plus"></i> Nuevo alimento personalizado
            </div>
            <div className="col-g">
              <div>
                <label>Nombre del alimento</label>
                <input type="text" placeholder="ej. Queso fresco batido 0%"
                  value={newF.name} onChange={e => setNewF(p => ({ ...p, name: e.target.value }))} />
              </div>
              <div className="row-g">
                <div style={{ flex:1 }}>
                  <label>Unidad</label>
                  <select value={newF.unit} onChange={e => setNewF(p => ({ ...p, unit: e.target.value, gramsPerUnit:'' }))}>
                    <option value="g">Gramos (g)</option>
                    <option value="ml">Mililitros (ml)</option>
                    <option value="uds">Unidades (uds)</option>
                  </select>
                </div>
                <div style={{ flex:1 }}>
                  <label>Kcal por {newF.unit === 'uds' ? '100g' : '100' + newF.unit}</label>
                  <input type="number" min="0" placeholder="kcal"
                    value={newF.kcal} onChange={e => setNewF(p => ({ ...p, kcal: e.target.value }))} />
                </div>
                <div style={{ flex:1 }}>
                  <label>Prot. por {newF.unit === 'uds' ? '100g' : '100' + newF.unit}</label>
                  <input type="number" min="0" step="0.1" placeholder="g"
                    value={newF.protein} onChange={e => setNewF(p => ({ ...p, protein: e.target.value }))} />
                </div>
                {newF.unit === 'uds' && (
                  <div style={{ flex:1 }}>
                    <label>Gramos por unidad</label>
                    <input type="number" min="0" placeholder="g"
                      value={newF.gramsPerUnit} onChange={e => setNewF(p => ({ ...p, gramsPerUnit: e.target.value }))} />
                  </div>
                )}
              </div>
              {newF.unit === 'uds' && newF.kcal && newF.protein && newF.gramsPerUnit && (
                <div className="preview" style={{ fontSize:11 }}>
                  <i className="ti ti-calculator" style={{ fontSize:11 }}></i>{' '}
                  Cada unidad ≈ <span className="kcal">{Math.round(+newF.gramsPerUnit/100*+newF.kcal)} kcal</span>
                  {' · '}
                  <span className="prot">{Math.round(+newF.gramsPerUnit/100*+newF.protein*10)/10}g prot.</span>
                </div>
              )}
              <div className="row-g">
                <button className="btn-save" onClick={saveCustom}>
                  <i className="ti ti-check"></i> Guardar alimento
                </button>
                <button className="btn-ghost" onClick={() => setShowAdd(false)}>
                  <i className="ti ti-x"></i> Cancelar
                </button>
              </div>
            </div>
          </div>
        )}

        {custom.length > 0 && (
          <div style={{ fontSize:11, color:'var(--text3)', textAlign:'center', marginTop:6 }}>
            {custom.length} alimento{custom.length > 1 ? 's' : ''} personalizado{custom.length > 1 ? 's' : ''} en la lista
          </div>
        )}

      </>)}

      {/* VISTA HISTÓRICO */}
      {!isToday && <HistoryView data={histData[viewDate]} />}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
